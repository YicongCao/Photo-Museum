[project]
name = "photo-museum"
version = "0.0.1"
description = "Self-hosted photo museum with read-only WebDAV indexing"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
media = ["Pillow==12.2.0", "pillow-heif==1.3.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
