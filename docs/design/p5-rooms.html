<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P5 展厅布局基准</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#e9e4db;font:14px Helvetica,'PingFang SC',sans-serif}nav{height:60px;border-bottom:1px solid #33291c;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;color:#b88b4a}button{background:none;color:inherit;border:0;font:inherit;padding:12px;cursor:pointer}button[aria-pressed=true]{color:#d8ae72;border-bottom:1px solid}main{height:calc(100dvh - 60px);padding:3vh 4vw;overflow:hidden}section{height:100%;display:none}section.active{display:grid}header{display:flex;align-items:center;gap:22px;height:64px}h1{font-size:42px;font-weight:300;margin:0}small{color:#a7a198}.calendar{grid-template-rows:64px 1fr}.grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(5,1fr);gap:5px}.day{border-top:1px solid #33291c;padding:8px;color:#b88b4a;position:relative;overflow:hidden}.day i{display:block;height:80%;margin-top:5px;background:linear-gradient(145deg,#59665b 10%,#243f49 40%,#b58f64 41%,#272c27 75%);opacity:.75}.day:nth-child(3n) i{background:linear-gradient(25deg,#22352e 45%,#5b7065 46%,#d3b888 55%,#576f80)}.day span{position:absolute;right:8px;bottom:8px;color:#e9e4db}.split{grid-template-columns:1fr 310px;gap:4vw}.map{background:radial-gradient(ellipse at 45% 50%,#1c171030 0%,#000 70%);display:grid;place-items:center;position:relative}.map svg{width:100%;stroke:#8c6b3f;fill:#15140e;stroke-width:1}.map b{position:absolute;left:60%;top:40%;border:1px solid #b88b4a;padding:14px;color:#d8ae72;background:#000}.list{border-left:1px solid #33291c;padding:20px;overflow:auto}.list p{padding:16px 0;border-bottom:1px solid #33291c}.gear{grid-template-columns:280px 1fr;gap:4vw}.gear svg{width:170px;stroke:#b88b4a;fill:none;stroke-width:1.5}.hero{height:68%;background:linear-gradient(145deg,#52685c 10%,#263c45 43%,#b58f64 44%,#272c27 75%)}.bars{height:15%;display:flex;gap:8px;align-items:end;margin-top:20px}.bars i{background:#b88b4a;flex:1}.space{position:relative;perspective:1100p </main><script>for(let n=1;n<=35;n++){const d=document.createElement('div');d.className='day';d.innerHTML=n<=31?`${n}${n%3?'<i></i><span>'+((n*7)%19+1)+'</span>':''}`:'';document.querySelector('#days').append(d)}for(let n=0;n<15;n++){const b=document.createElement('i');b.style.height=(15+(n*37)%85)+'%';document.querySelector('#bars').append(b)}document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===b.dataset.room));document.querySelectorAll('[data-room]').forEach(x=>x.setAttribute('aria-pressed',x===b))});</script></html>
