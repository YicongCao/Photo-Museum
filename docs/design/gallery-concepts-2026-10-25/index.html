<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Gallery 概念图 · 2026-10-25</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#e9e4db;font:14px/1.75 system-ui}header,main,footer{max-width:1600px;margin:auto;padding:28px 32px}header{border-bottom:1px solid #4c3920}h1{font-size:30px;font-weight:300;margin:0 0 6px}header p,footer{color:#a7a198;font-size:12px}nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}button,a{font:inherit}button{cursor:pointer;min-height:44px;padding:8px 16px;border:1px solid #70532e;background:#000;color:#d8ae72}button[aria-pressed=true]{background:#b88b4a;color:#000}button:focus-visible,a:focus-visible{outline:2px solid #d8ae72;outline-offset:3px}a{color:#d8ae72}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 28px}.card[hidden]{display:none}.poster{display:block;width:100%;padding:0;border:1px solid #33291c;background:#050403;position:relative;overflow:hidden;aspect-ratio:1.6}.poster img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .25s}.poster:hover img{transform:scale(1.015)}.poster>span{position:absolute;right:10px;bottom:10px;padding:4px 8px;background:#000b;color:#d8ae72;font-size:11px}.title-line{display:flex;align-items:baseline;gap:12px;margin:14px 0 6px}.title-line>small{color:#b88b4a;font-size:11px;white-space:nowrap}.title-line h2{font-size:22px;font-weight:300;margin:0}.purpose{color:#c7b293;margin:0 0 9px}.card p{font-size:13px;margin:6px 0}.card details{color:#a7a198;font-size:12px;margin-top:12px}.card summary{cursor:pointer;color:#b88b4a}.card details p{font-size:12px}.card a{font-size:12px}footer{border-top:1px solid #33291c}.recommend{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.recommend b{color:#d8ae72;font-weight:400}dialog{border:1px solid #70532e;background:#000;color:#e9e4db;padding:0;width:calc(100vw - 40px);max-width:1800px;max-height:calc(100dvh - 40px);overflow:auto}dialog::backdrop{background:#000d;backdrop-filter:blur(10px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 18px}.dialog-head h2{font-size:18px;font-weight:400;margin:0}.dialog-buttons{display:flex;gap:8px}.dialog-image{display:block;width:100%;max-height:72dvh;object-fit:contain;background:#000}.dialog-caption{margin:0;padding:12px 18px;font-size:13px;color:#b8ad9d}.dialog-caption small{display:block;color:#a7a198;margin-top:5px}.dialog-caption a{margin-left:12px}@media(max-width:700px){header,main,footer{padding:20px 16px}main{grid-template-columns:1fr;gap:28px}h1{font-size:27px}nav{gap:8px}nav button{padding:8px 12px;font-size:12px}.title-line h2{font-size:21px}dialog{width:calc(100vw - 16px);max-height:calc(100dvh - 16px)}.dialog-head{padding:8px;gap:8px}.dialog-head h2{font-size:14px}.dialog-buttons{gap:5px}.dialog-buttons button{padding:6px 10px;min-width:40px}.dialog-image{max-height:62dvh}.dialog-caption{padding:10px 12px}}@media(prefers-reduced-motion:reduce){.poster img{transition:none}.poster:hover img{transform:none}}</style>
<header><h1>Gallery 概念图</h1><p>2026 · 10 · 25　／　已有形式 6　·　新构思 4　／　生成示意，非真实图库或已交付页面</p><nav aria-label="概念分类"><button data-filter="all" aria-pressed="true">全部 10</button><button data-filter="existing" aria-pressed="false">已有形式 6</button><button data-filter="new" aria-pressed="false">新构思 4</button></nav></header><main id="cards"></main><footer><div class="recommend"><b>建议优先比较</b><span>故地重游 → 记忆长卷 → 人生年轮 → 记忆星图</span></div><p>全部照片为模型生成。地图轮廓、器材线稿、文字和示例数量不作事实或功能验收依据。</p><a href="./design-notes.md">构思、可用数据与落地边界</a>　·　<a href="./manifest.json">生成提示词与图像校验清单</a></footer>

<script>const items=[{"id": "01", "group": "existing", "title": "Cover Flow", "file": "existing/01-cover-flow.png", "purpose": "按活动主题浏览", "visual": "中央横向十图拼版、两侧透视封面、长倒影与三级时间线。", "implementation": "已有活动封面、有效评分 Top10、目录年月；连续滚动与原地返回继续复用。", "boundary": "概念图的导航、边框和文字仅作示意；正式版以当前交互及响应式研究为准。", "width": 1586, "height": 992}, {"id": "02", "group": "existing", "title": "活动照片墙", "file": "existing/02-photo-wall.png", "purpose": "完整浏览一场活动", "visual": "保留照片原比例的横向瀑布流，以内容密度呈现活动全过程。", "implementation": "复用活动分页、4K预览、按拍摄时间排序、单图暗房。", "boundary": "图中日期、128张及视频数量均为虚构示例，不是本库统计。", "width": 1586, "height": 992}, {"id": "03", "group": "existing", "title": "日历展厅", "file": "existing/03-calendar.png", "purpose": "从某一天回到记忆", "visual": "年／月／周缩放，日期格显示照片，缺日期单列。", "implementation": "复用effective拍摄时间及日期精度；目录只有年/月时不伪造日。", "boundary": "生成日期格与数量不作为日历算法验收；必须由真实数据渲染。", "width": 1586, "height": 992}, {"id": "04", "group": "existing", "title": "地图展厅", "file": "existing/04-map.png", "purpose": "从去过的地方浏览", "visual": "本地世界地图、国家省市聚合、活动照片与地点列表并列。", "implementation": "复用当前有效GPS与GeoNames近似城市；精确GPS不传第三方。", "boundary": "AI生成的地图轮廓、国界及地点位置不能作地图数据或精度依据。", "width": 1586, "height": 992}, {"id": "05", "group": "existing", "title": "器材馆", "file": "existing/05-equipment.png", "purpose": "沿设备回顾摄影经历", "visual": "相机／镜头线稿、使用年代、评分精选与手工标记照片。", "implementation": "复用相机、镜头、焦距、年份、技术分及人工标记。", "boundary": "器材轮廓和型号文字仅示意；最终线稿需核对实际型号。", "width": 1586, "height": 992}, {"id": "06", "group": "existing", "title": "时空隧道", "file": "existing/06-spacetime.png", "purpose": "沉浸沿时间前进", "visual": "活动画板向单一消失点递进，与对称Cover Flow区分。", "implementation": "复用活动列表、少量驻留拼版、三级时间线与共享照片墙。", "boundary": "生成图把前景简化为单张照片；正式活动画板仍须保留最多Top10拼版。", "width": 1586, "height": 992}, {"id": "07", "group": "new", "title": "人生年轮", "file": "explorations/07-life-rings.png", "purpose": "看见整部照片集的时间跨度", "visual": "年份化作同心照片环，旋转或选择一环，展开其中活动。", "implementation": "第一版按年分桶，每环只选少量代表缩略图，右侧展开活动；SVG裁切或局部WebGL实现。", "boundary": "年份有据、月份缺失保留未知；不要用照片密度推断人生幸福或填补缺失年月。", "width": 1586, "height": 992}, {"id": "08", "group": "new", "title": "记忆星图", "file": "explorations/08-memory-constellations.png", "purpose": "发现跨活动的联系", "visual": "主体、风格、匿名人物组形成照片群；选中一张，沿关联继续探索。", "implementation": "先用现有主体/style/topic和人工人物组聚合；相似度连线若需要向量，新增本地embedding provider与版本索引。", "boundary": "连线需能解释依据与置信度；候选标签不冒充事实，不运行外部人脸识别，不自动建立真实社会关系。", "width": 1586, "height": 992}, {"id": "09", "group": "new", "title": "记忆长卷", "file": "explorations/09-memory-scroll.png", "purpose": "把照片编成可回看的章节", "visual": "跨年份与活动混排，主图、细节和留白形成一段横向叙事。", "implementation": "基于原规划B长卷扩展。复用策展集合与4K调度，新增章节、顺序、主图和人工改序；agent只做可审阅草稿。", "boundary": "章节标题可人工编辑；不生成未经用户确认的人生事实。与整场活动密集照片墙用途不同。", "width": 1586, "height": 992}, {"id": "10", "group": "new", "title": "故地重游", "file": "explorations/10-return-to-place.png", "purpose": "看见时间留下的变化", "visual": "相同地点在不同年份并排或叠化对照，底部胶卷切换年份。", "implementation": "先支持人工选片配对，复用双4K和按需原图；再以真实GPS、日期和本地视觉相似度推荐候选。", "boundary": "同城市不等于同地点，GPS缺失/推断也不能作同机位证据；配对先让人确认，禁止生成或改造真实旧照片来补对照。", "width": 1586, "height": 992}];
const main=document.querySelector('#cards'),dialog=document.querySelector('dialog'),image=dialog.querySelector('img');let current=0;
const el=(tag,text)=>{const n=document.createElement(tag);if(text)n.textContent=text;return n};
items.forEach((item,index)=>{const card=el('article');card.className='card';card.dataset.group=item.group;const button=el('button');button.className='poster';button.setAttribute('aria-label',item.id+' '+item.title+' 概念图');const img=el('img');img.src=item.file;img.alt=item.title+' 概念图';img.width=item.width;img.height=item.height;img.loading=index<2?'eager':'lazy';button.append(img,el('span','查看大图 ↗'));button.onclick=()=>{show(index);dialog.showModal()};const title=el('div');title.className='title-line';title.append(el('small',item.id+' · '+(item.group==='new'?'新构思':'已有形式')),el('h2',item.title));const purpose=el('p',item.purpose);purpose.className='purpose';const details=el('details');details.append(el('summary','数据与落地'),el('p',item.implementation),el('p',item.boundary));card.append(button,title,purpose,el('p',item.visual),details);main.append(card)});
function show(index){current=(index+items.length)%items.length;const item=items[current];document.querySelector('#dialog-title').textContent=item.id+' · '+item.title+' · '+(item.group==='new'?'新构思':'已有形式');image.src=item.file;image.alt=item.title+' 完整概念图';const caption=document.querySelector('.dialog-caption');caption.textContent=item.visual;caption.append(el('small',item.boundary));const a=el('a','原始 PNG ↗');a.href=item.file;a.download=item.file.split('/').pop();caption.append(a)}
for(const b of document.querySelectorAll('[data-filter]'))b.onclick=()=>{const filter=b.dataset.filter;for(const x of document.querySelectorAll('[data-filter]'))x.setAttribute('aria-pressed',String(x===b));for(const card of main.children)card.hidden=filter!=='all'&&card.dataset.group!==filter};document.querySelector('#close').onclick=()=>dialog.close();document.querySelector('#previous').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);dialog.onclose=()=>image.removeAttribute('src');dialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();show(current+(e.key==='ArrowRight'?1:-1))}});
</script></html>
